name: Qaari
options:
  bundleIdPrefix: org.somaliland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Qaari:
    type: application
    platform: iOS
    sources:
      - path: Qaari
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.somaliland.qaari
        PRODUCT_NAME: Qaari
        INFOPLIST_FILE: Qaari/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    info:
      path: Qaari/Info.plist
      properties:
        CFBundleDisplayName: Qaari
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
